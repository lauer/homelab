---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json

controllers:
  whoami:
    strategy: RollingUpdate
    containers:
      whoami:
        image:
          repository: ghcr.io/traefik/whoami
          tag: latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 64Mi

ingress:
  whoami:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: &host whoami3.k8s.home.lauer.dk
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: whoami
              port: http
    tls:
      - hosts:
          - *host
        secretName: whoami3-tls-certificate

service:
  whoami:
    controller: whoami
    ports:
      http:
        port: 80