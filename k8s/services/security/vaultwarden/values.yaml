---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/library/common/values.schema.json

controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: vaultwarden/server
          tag: 1.35.4
          pullPolicy: IfNotPresent
        env:
          # -- Config dir
          DATA_FOLDER: "config"

service:
  main:
    controller: main
    ports:
      http:
        port: 80

ingress:
  main:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: &host bw.k8s.home.lauer.dk
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - *host
        secretName: vaultwarden-tls
persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config