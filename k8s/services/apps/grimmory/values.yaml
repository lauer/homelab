# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/library/common/values.schema.json

controllers:
  main:
    strategy: Recreate
    containers:
      grimmory:
        image:
          repository: grimmory/grimmory
          tag: v3.3.3
          pullPolicy: IfNotPresent
        env:
          - name: USER_ID
            value: "1000"
          - name: GROUP_ID
            value: "1000"
          - name: TZ
            value: Europe/Copenhagen
          - name: DATABASE_HOST
            value: grimmory-mariadb
          - name: DATABASE_PORT
            value: "3306"
          - name: DATABASE_NAME
            value: grimmory
          - name: DATABASE_USERNAME
            valueFrom:
              secretKeyRef:
                name: grimmory-credentials
                key: database-username
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grimmory-credentials
                key: database-password
        probes:
          readiness:
            enabled: true

service:
  main:
    controller: main
    ports:
      http:
        port: 6060

ingress:
  main:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: &host grimmory.k8s.home.lauer.dk
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - *host
        secretName: grimmory-tls-certificate

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 1Gi
    globalMounts:
      - path: /app/data
  books:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: longhorn
    size: 10Gi
    globalMounts:
      - path: /books
