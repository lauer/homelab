# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-4.1.1/charts/other/app-template/values.schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.6.2

    helm:
      valuesObject:

        controllers:
          main:
            strategy: RollingUpdate
            containers:
              grafana:
                image:
                  repository: grafana/grafana
                  tag: 12.3.5
                  pullPolicy: IfNotPresent
                probes:
                  readiness:
                    enabled: true
                  startup:
                    enabled: true

        service:
          main:
            controller: main
            ports:
              http:
                port: 3000

        ingress:
          main:
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - host: &host grafana.k8s.home.lauer.dk
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: main
                      port: http
            tls:
              - hosts:
                  - *host
                secretName: grafana-k8s-certificate
        persistence:
          config:
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            size: 1Gi
            forceRename: grafana-pvc
            globalMounts:
              - path: /var/lib/grafana