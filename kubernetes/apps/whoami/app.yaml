# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/library/common/values.schema.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami2
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: kustomtest

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true

  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 4.4.0
    helm:
      valuesObject:

        strategy: RollingUpdate

        controllers:
          main:
            containers:
              main:
                image:
                  repository: traefik/whoami
                  tag: latest

        service:
          main:
            controller: main
            ports:
              http:
                port: 80

        ingress:
          main:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: traefik
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - host: &host whoami2.k8s.home.lauer.dk
                paths:
                  - path: /
                    pathType: Prefix
                    service:
                      identifier: main
                      port: http
            tls:
              - hosts:
                  - *host
                secretName: whoami2-tls-certificate